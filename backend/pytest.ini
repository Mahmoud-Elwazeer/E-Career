[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    -v
    --tb=short
    --ds=config.settings.development
    --cov=apps
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=30
    --reuse-db
norecursedirs = .git .tox node_modules venv staticfiles media
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    external: Tests requiring external services

# Test paths
testpaths =
    apps
    tests

# Coverage configuration
[coverage:run]
source = .
omit = 
    */migrations/*
    */management/commands/*
    */wsgi.py
    */asgi.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
show_missing = True
skip_covered = False
exclude_lines = 
    pragma: no cover
    def __repr__
    if self.debug:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    def __str__
