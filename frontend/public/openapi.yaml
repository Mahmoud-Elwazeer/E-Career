openapi: "3.0.3"
info:
  title: USAM Careers Mock API
  version: "1.0.0"
  description: |
    Frontend-only mock API contract used by the API docs page.
    All data is provided by local mock data in the client.

servers:
  - url: /
    description: Frontend mock runtime

tags:
  - name: Jobs
    description: Jobs browsing/search/filter endpoints (mocked in frontend)
  - name: Companies
    description: Company lookup (mocked in frontend)
  - name: Sources
    description: Source lookup (mocked in frontend)

components:
  schemas:
    Job:
      type: object
      properties:
        id:
          type: string
          example: j1
        title:
          type: string
          example: Frontend Developer
        companyId:
          type: string
          example: c1
        location:
          type: string
          example: Dubai, UAE
        locationType:
          type: string
          enum: [remote, onsite, hybrid]
        industry:
          type: string
          example: technology
        experienceLevel:
          type: string
          enum: [entry, mid, senior, lead, executive]
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        salaryMin:
          type: integer
          nullable: true
        salaryMax:
          type: integer
          nullable: true
        salaryCurrency:
          type: string
          nullable: true
        sourceUrl:
          type: string
          format: uri
        sourceId:
          type: string
          example: s1
        postedAt:
          type: string
          format: date

    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type: string
          format: uri
          nullable: true
        industry:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true

    Source:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri

paths:
  /jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query
        - in: query
          name: workMode
          schema:
            type: string
            enum: [remote, onsite, hybrid]
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: seniority
          schema:
            type: string
            enum: [entry, mid, senior, lead, executive]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: perPage
          schema:
            type: integer
            default: 20
        - in: query
          name: sort
          schema:
            type: string
            enum: [latest, salary-high, salary-low]
            default: latest
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  total:
                    type: integer

  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get job by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /companies:
    get:
      tags: [Companies]
      summary: List companies
      responses:
        "200":
          description: Companies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"

  /sources:
    get:
      tags: [Sources]
      summary: List sources
      responses:
        "200":
          description: Sources list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
