<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .status { padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .connected { background: #ecfdf5; color: #065f46; }
    .disconnected { background: #fef2f2; color: #991b1b; }
    label { font-size: 13px; display: block; margin-bottom: 4px; color: #374151; }
    input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 12px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .info { font-size: 12px; color: #6b7280; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>E-Career Autofill</h1>
  <div id="status"></div>
  <div id="login-form">
    <label for="token">Extension Token</label>
    <input id="token" type="password" placeholder="eck_...">
    <button class="btn-primary" id="connect">Connect</button>
    <p class="info">Generate a token at Settings &gt; Extension Tokens on E-Career.</p>
  </div>
  <div id="connected-view" style="display:none;">
    <p id="profile-name" style="font-size: 14px; font-weight: 600;"></p>
    <button class="btn-danger" id="disconnect">Disconnect</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
