version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecareer_postgres
    environment:
      POSTGRES_DB: ecareer_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ecareer@@WWQ2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecareer_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: ecareer_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecareer_network

  # Typesense Search Engine
  typesense:
    image: typesense/typesense:27.1
    container_name: ecareer_typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-ecareer_typesense_dev_key}
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    ports:
      - "8108:8108"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecareer_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecareer_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ecareer_dev}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    networks:
      - ecareer_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecareer_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - media_files:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ecareer_dev}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecareer_network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecareer_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ecareer_dev}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - ecareer_network
    restart: unless-stopped

  # Change Detection (career page monitoring)
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: ecareer_changedetection
    volumes:
      - changedetection_data:/datastore
    ports:
      - "5000:5000"
    environment:
      - BASE_URL=http://localhost:5000
      - HIDE_REFERER=true
    networks:
      - ecareer_network
    restart: unless-stopped

volumes:
  postgres_data:
    name: ecareer_postgres_data
  redis_data:
    name: ecareer_redis_data
  typesense_data:
    name: ecareer_typesense_data
  media_files:
    name: ecareer_media
  static_files:
    name: ecareer_static
  changedetection_data:
    name: ecareer_changedetection_data

networks:
  ecareer_network:
    name: ecareer_network
    driver: bridge
