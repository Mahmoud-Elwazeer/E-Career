# ============================================================================
# USAM production infrastructure services (Typesense, Qdrant) — RECONSTRUCTED
# ============================================================================
# This file reconstructs the Docker Compose definition for the two
# infrastructure containers that are LIVE on the production server
# (ip-172-31-30-83) under the Compose project name "usam", but whose original
# compose file (previously at /var/www/usam/docker-compose.services.yml) is
# missing from disk. It does NOT replace the running containers — it exists
# so they can be recreated identically if the container objects are ever
# lost (accidental `docker rm`, Docker upgrade, host migration, etc).
#
# Reconstructed 2026-10-02 from live `docker inspect` output on the server:
#   - usam_typesense: image typesense/typesense:27.1, created 2026-08-01,
#     RestartPolicy=unless-stopped, port 8108->8108, volume
#     usam_typesense_data:/data, api key passed as a CLI flag (NOT an env
#     var in the live container - Config.Env only contained PATH).
#   - usam_qdrant: image qdrant/qdrant:v1.11.3, ports 6333-6334->6333-6334.
#
# DO NOT run `docker compose -f this-file up -d` against the live project
# unless you intend to recreate the containers. Preferred use:
#   1. `docker compose -f deploy/docker-compose.services.yml config` to
#      validate syntax and compare the rendered config against the live
#      container (see audit doc for the sanctioned comparison).
#   2. Only recreate if the original container object is actually lost -
#      Docker will reuse the named volumes below if they still exist, so no
#      data is lost even in a real recreation.
#
# Secret handling: TYPESENSE_API_KEY must be set in the environment (or an
# untracked .env file alongside this compose file, outside Git) before
# running any `docker compose` command against this file. It is never
# hardcoded here and the ${VAR:?...} syntax below makes Compose refuse to
# run if it's missing, rather than silently falling back to a wrong default
# (the exact root cause of the earlier Typesense 401 incident on the Django
# side - this file is written to never repeat that failure mode).
# ============================================================================

name: usam

services:
  typesense:
    image: typesense/typesense:27.1
    container_name: usam_typesense
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required - set it in the environment or an untracked .env file, never in this compose file}", "--enable-cors"]
    ports:
      - "8108:8108"
    volumes:
      - usam_typesense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8108/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: usam_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - usam_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

# IMPORTANT: these MUST match the EXISTING live volume names exactly
# (confirmed via `docker volume ls` on the server: usam_typesense_data,
# usam_qdrant_data). Compose would otherwise prefix them with the project
# name and create new, empty volumes instead of reusing the real data.
volumes:
  usam_typesense_data:
    name: usam_typesense_data
    external: true
  usam_qdrant_data:
    name: usam_qdrant_data
    external: true
